# What the Android plugin of the mobile basis may depend on: the kit's rules, and what Tauri brings with it (as in the
# Tauri apps of the family, docmap-desktop's src-tauri/deny.toml). Run: cargo deny --manifest-path mobile-plugin/Cargo.toml check
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    # Permissive, a notice only (through tauri).
    "Zlib",
    # File-level copyleft of crates used unchanged (cssparser, selectors and friends, through tauri-utils): no effect on
    # the code of the kit or an app.
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    # proc-macro-error: unmaintained, a macro of the build that tauri's own macros pull in; it runs at compile time only
    # and holds no known hole. Look again when tauri moves.
    "RUSTSEC-2024-0370",
]
