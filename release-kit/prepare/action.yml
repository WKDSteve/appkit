# release-kit/prepare: which commit gets the rolling build of a channel (`latest`, `nightly`, `stable`)?
#
# The newest commit of the branch whose CI run is green (rule GIT-08), not the tip: a red tip, or one whose CI is
# still running, must not keep the newest green commit from being built. `latest` only moves forward: a target that
# is not a descendant of the commit in `version.json` of the built `latest` builds nothing. The decision is
# release-kit/pick_target.py. When the pre-release `latest` does not exist yet, it is made once (at the target,
# marked "starting"); its files and, last, its words are changed by release-kit/publish.
#
# Used in the job that decides, with `contents: write`, after a green CI run (or by hand, with a commit):
#
#   - id: prepare
#     uses: WKDSteve/appkit/release-kit/prepare@<sha> # vX.Y.Z
#     with:
#       sha: ${{ github.event.inputs.sha }}   # empty for a workflow_run: the newest green commit
#       token: ${{ github.token }}
#
# The job hands `steps.prepare.outputs.current` (and `sha`, `short`) on to the build jobs. Several runs may be
# waiting at once: give the workflow ONE concurrency group without cancel-in-progress, so an older run neither
# replaces nor cancels a newer build (each run decides on the state at its own start).
#
# Linux, macOS, hosted Windows and a self-hosted Windows runner: the work is release-kit/prepare.sh, run by `bash`
# where `bash` is bash and by Git Bash (full path, 8.3 form) on Windows, where `bash` of a self-hosted runner is the
# WSL launcher. The step is written twice (one `if` each) for that reason; `steps.facts` is the Windows one there.

name: release-kit prepare
description: Decide whether a commit gets a rolling build, and make the pre-release `latest` once.

inputs:
  sha:
    description: A full commit id to build by hand (it must be green and on the branch). Empty - the newest green commit.
    required: false
    default: ""
  ci-workflow:
    description: The file name of the CI workflow whose green runs count.
    required: false
    default: ci.yml
  channel:
    description: "The channel this run is for: latest (the newest green commit), nightly (the tip, green or not) or stable (the latest of 14 days ago)."
    required: false
    default: latest
  channels:
    description: "The channels the app has switched on, separated by spaces (the one line of its release configuration). A run for another channel builds nothing."
    required: false
    default: latest
  token:
    description: A token with contents write (github.token).
    required: true
  branch:
    description: The branch whose tip is built.
    required: false
    default: main

outputs:
  current:
    description: "'true' when a commit is to be built."
    value: ${{ steps.facts.outputs.current || steps.facts_windows.outputs.current }}
  sha:
    description: The commit.
    value: ${{ steps.facts.outputs.sha || steps.facts_windows.outputs.sha }}
  short:
    description: The first seven characters of the commit.
    value: ${{ steps.facts.outputs.short || steps.facts_windows.outputs.short }}

runs:
  using: composite
  steps:
    - name: Which commit is built, and does the pre-release exist
      id: facts
      if: runner.os != 'Windows'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SHA: ${{ inputs.sha }}
        BRANCH: ${{ inputs.branch }}
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        CHANNEL: ${{ inputs.channel }}
        CHANNELS: ${{ inputs.channels }}
        KIT: ${{ github.action_path }}/..
      run: bash "$KIT/prepare.sh"
    - name: Which commit is built, and does the pre-release exist (Windows)
      id: facts_windows
      if: runner.os == 'Windows'
      shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
      env:
        GH_TOKEN: ${{ inputs.token }}
        SHA: ${{ inputs.sha }}
        BRANCH: ${{ inputs.branch }}
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        CHANNEL: ${{ inputs.channel }}
        CHANNELS: ${{ inputs.channels }}
        KIT: ${{ github.action_path }}/..
      run: bash "$(cygpath -u "$KIT")/prepare.sh"
