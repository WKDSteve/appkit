[workspace]
resolver = "3"
members = ["crates/appkit-core", "crates/appkit-hub", "crates/appkit-scratch", "crates/appkit-testkit", "crates/sheet-driver"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Stefan Bartl"]
repository = "https://github.com/WKDSteve/appkit"

[workspace.lints.rust]
# deny, not forbid: one module may allow it (appkit-hub/src/handles.rs, Windows only).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
