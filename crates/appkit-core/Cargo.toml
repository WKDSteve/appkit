[package]
name = "appkit-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Tauri-free building blocks of the local app server: process, safe read, path guard, authn, SSE, registry"

[lints]
workspace = true

[dependencies]
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "process", "time", "macros", "rt"] }

[dev-dependencies]
appkit-scratch = { path = "../appkit-scratch" }

# `child::watcher_main` must be the first call of the program's `main`, so this test has its own.
[[test]]
name = "group_watcher"
harness = false

# The direct calls of the system (src/job.rs, src/console.rs, src/acl.rs): the version the rest of the kit uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# The process group and the parent-death signal of a child (src/child/unix.rs): the version tokio already brings.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
