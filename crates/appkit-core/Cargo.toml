[package]
name = "appkit-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Tauri-free building blocks of the local app server: process, safe read, path guard, authn, SSE, registry"

[lints]
workspace = true

[dependencies]
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "process", "time", "macros", "rt"] }

[dev-dependencies]
appkit-scratch = { path = "../appkit-scratch" }

# The one direct call of the system (src/job.rs): the version the rest of the kit uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects"] }
