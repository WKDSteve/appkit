# CI of appkit.
#
# Runs on the maintainer's self-hosted Windows runner, on pushes to main only. There is deliberately no
# `pull_request` trigger: a pull request would run its own workflow code on that machine. Contributions are
# checked by the maintainer before they land. ShellCheck of the release-kit shell scripts runs on the same runner.
#
# The one exception is `rust-other-systems`: there is no local macOS or Linux runner, so clippy and the tests of those
# two systems run on GitHub's hosted runners (free for a public repository).
#
# The tools (cargo, rustfmt, clippy, cargo-audit, cargo-deny, pnpm, python) are expected on the runner's PATH and are
# not pinned here; the jobs print their versions.

name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in 8.3 form because the
# shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  rust:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit; the comment names the tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: cargo --version && rustc --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # No Neovim is needed: the binary fake-engine of appkit-testkit stands in for an engine.
      # The tests get a temp dir of their own, empty at the start, and nothing may be left in it afterwards: a test
      # takes its folder from appkit-scratch's `Scratch`, which removes it also when the test fails.
      - name: cargo test (nothing left in the temp dir)
        run: |
          t="$RUNNER_TEMP/appkit-test-temp"
          rm -rf "$t" && mkdir -p "$t"
          TEMP="$t" TMP="$t" TMPDIR="$t" cargo test --workspace --locked
          left="$(ls -A "$t")"
          if [ -n "$left" ]; then
            printf 'the tests left this in the temp dir:\n%s\n' "$left"
            exit 1
          fi

  # Clippy and the tests on the systems of the code behind `cfg(not(windows))` and `cfg(unix)`, which the Windows runner
  # neither lints nor runs. Formatting and the other jobs do not need a second system and stay on the runner.
  rust-other-systems:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    # The Git Bash of the workflow's default exists on the Windows runner only.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # The image's toolchain can be older than the workspace's rust-version.
      - run: rustup toolchain install stable --profile minimal --component clippy --no-self-update && rustup default stable
      - run: cargo --version && rustc --version
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test (nothing left in the temp dir)
        run: |
          t="$RUNNER_TEMP/appkit-test-temp"
          rm -rf "$t" && mkdir -p "$t"
          TEMP="$t" TMP="$t" TMPDIR="$t" cargo test --workspace --locked
          left="$(ls -A "$t")"
          if [ -n "$left" ]; then
            printf 'the tests left this in the temp dir:\n%s\n' "$left"
            exit 1
          fi

  supply-chain:
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # Known advisories, licenses, sources, and no app's crate in the tree of the kit.
      - run: cargo audit
      - run: cargo deny check
      # No crate version younger than a week (see tools/check-lock-age.py).
      - run: python tools/check-lock-age.py --min-days 7

  # The tools test themselves; no control character in a tracked file, no colour in the CSS of the kit outside its tokens.
  hygiene:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: python -m unittest discover tools
      - run: python tools/check-control-chars.py
      - run: python tools/check-color-literals.py --root ui-kit/src --tokens ui-kit/src/tokens.css

  # The release kit (release-kit): stamping, install.sh with Git Bash, install.ps1 with pwsh and
  # Windows PowerShell 5.1 against fake builds, publish.sh against a fake gh.
  release-kit:
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # Windows PowerShell 5.1 started from the runner finds no Get-FileHash without its own module path.
      - run: python -m unittest discover -s release-kit -p "test_*.py" -v
        env:
          PSModulePath: C:\Program Files\WindowsPowerShell\Modules;C:\Windows\system32\WindowsPowerShell\v1.0\Modules
      # The scripts every release of every app carries: no finding of ShellCheck (any level; on the runner via
      # `scoop install shellcheck`) and, below, of PSScriptAnalyzer.
      - name: shellcheck on the shell scripts
        run: shellcheck release-kit/scripts/install.sh release-kit/publish.sh release-kit/prepare.sh
      # install.ps1: no finding of PSScriptAnalyzer (errors, warnings and information).
      - name: PSScriptAnalyzer on install.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $found = Invoke-ScriptAnalyzer -Path release-kit/scripts/install.ps1 -Severity Error, Warning, Information
          $found | Format-Table -AutoSize | Out-String | Write-Output
          if ($found) { exit 1 }

  # The browser parts of the kit (ui-kit): source only, checked and tested here; the apps bundle it.
  ui-kit:
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui-kit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # The lockfile is the truth; the age and trust policy are in ui-kit/pnpm-workspace.yaml. pnpm is the
      # runner's own (not installed globally here: that would change this machine on every run).
      - run: pnpm --version && pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm audit --audit-level high

  # The parts of a web variant (web-kit, appkit-web): plain JavaScript without dependencies; Node's own test runner.
  # The hand-written declarations (src/*.d.ts) are type-checked against a consumer (test/types/consumer.ts) with the
  # TypeScript of ui-kit, so web-kit itself still installs nothing: only ui-kit's locked dependencies are installed.
  web-kit:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-kit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: node --version && pnpm --version
      - run: pnpm test
      - run: pnpm -C ../ui-kit install --frozen-lockfile
      - run: pnpm check
